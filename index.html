<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Four</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Typography & Professional Color System */
      :root {
        --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        
        /* Solid Light Screen Background */
        --bg-light: #f1f5f9;
        --text-primary: #0f172a;
        --text-secondary: #64748b;
        
        /* Slate-Grey Board Design (Not baby blue) */
        --board-bg: #334155; 
        --board-border: #1e293b;
        --board-shadow: 
          0 20px 25px -5px rgba(15, 23, 42, 0.15), 
          0 8px 10px -6px rgba(15, 23, 42, 0.15),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
        
        /* Token Holes */
        --token-empty: #f1f5f9; /* Same as screen background for cutout hole effect */
        --token-empty-hover: #e2e8f0; /* Hover slot highlight */
        --color-crimson: #e11d48; /* Red player token */
        --color-amber: #f59e0b;   /* Yellow/Amber player token */
        
        /* Buttons */
        --btn-primary-bg: #0f172a;
        --btn-primary-text: #ffffff;
        --btn-secondary-bg: #ffffff;
        --btn-secondary-text: #334155;
        --btn-border: #cbd5e1;

        /* Sizing variables for responsiveness */
        --cell-size: 60px;
        --cell-margin: 0.3rem;
        --board-padding: 0.75rem;
      }

      body {
        background-color: var(--bg-light) !important;
        color: var(--text-primary);
        display: flex;
        flex-direction: column !important;
        justify-content: center;
        align-items: center;
        margin: 0;
        min-height: 100vh;
        font-family: var(--font-family);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Header & Typography */
      h1 {
        font-size: 2.25rem;
        font-weight: 700;
        letter-spacing: -0.04em;
        margin: 0 0 0.25rem 0;
        color: var(--text-primary);
        text-align: center;
      }

      .subtitle {
        font-size: 0.9rem;
        color: var(--text-secondary);
        margin-bottom: 2rem;
        font-weight: 500;
        letter-spacing: -0.01em;
      }

      /* Buttons Container */
      .actions {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 2.5rem;
      }

      .action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
        font-family: var(--font-family);
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
        padding: 0.625rem 1.25rem;
        min-width: 130px;
        border-radius: 0.5rem;
        transition: all 0.15s ease-in-out;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      }

      .action.join {
        background-color: var(--btn-primary-bg);
        color: var(--btn-primary-text);
        border: 1px solid var(--btn-primary-bg);
      }

      .action.join:hover {
        background-color: #1e293b;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
      }

      .action.watch {
        background-color: var(--btn-secondary-bg);
        color: var(--btn-secondary-text);
        border: 1px solid var(--btn-border);
      }

      .action.watch:hover {
        background-color: #f8fafc;
        border-color: #94a3b8;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
      }

      .action[href=""] {
        display: none;
      }

      /* The Board (Professional Charcoal Slate design) */
      .board {
        background-color: var(--board-bg) !important;
        border: 4px solid var(--board-border);
        border-radius: 1.25rem;
        box-shadow: var(--board-shadow);
        display: flex;
        flex-direction: row;
        padding: var(--board-padding);
      }

      /* Columns */
      .column {
        display: flex;
        flex-direction: column-reverse;
        padding: 0.125rem;
        cursor: pointer;
        border-radius: 0.5rem;
        transition: background-color 0.15s ease;
      }

      .column:hover {
        background-color: rgba(255, 255, 255, 0.12);
      }

      /* Connect 4 Cells */
      .cell {
        border-radius: 50%;
        width: var(--cell-size);
        height: var(--cell-size);
        margin: var(--cell-margin);
        box-shadow: inset 0 3px 5px rgba(0, 0, 0, 0.35);
        transition: 
          background-color 0.2s ease, 
          transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .empty {
        background-color: var(--token-empty);
        border: 1px solid rgba(0, 0, 0, 0.1);
      }

      .column:hover .empty {
        background-color: var(--token-empty-hover);
      }

      .column:hover .empty ~ .empty {
        background-color: var(--token-empty);
      }

      /* Placed Tokens */
      .red {
        background-color: var(--color-crimson);
        box-shadow: 
          inset 0 -4px 0 rgba(0, 0, 0, 0.25), 
          inset 0 2px 4px rgba(255, 255, 255, 0.35),
          0 4px 8px rgba(0, 0, 0, 0.25);
        transform: scale(1.02);
      }

      .yellow {
        background-color: var(--color-amber);
        box-shadow: 
          inset 0 -4px 0 rgba(0, 0, 0, 0.25), 
          inset 0 2px 4px rgba(255, 255, 255, 0.35),
          0 4px 8px rgba(0, 0, 0, 0.25);
        transform: scale(1.02);
      }

      /* Responsive Design for Mobile Devices (Pixel, iPhone, etc.) */
      @media (max-width: 640px) {
        :root {
          --cell-size: 42px;
          --cell-margin: 0.2rem;
          --board-padding: 0.5rem;
        }
        h1 {
          font-size: 1.75rem;
        }
        .subtitle {
          margin-bottom: 1.5rem;
          font-size: 0.85rem;
        }
        .actions {
          margin-bottom: 1.5rem;
          gap: 0.5rem;
        }
        .action {
          min-width: 120px;
          padding: 0.5rem 1rem;
          font-size: 0.8rem;
        }
      }

      @media (max-width: 390px) {
        :root {
          --cell-size: 34px;
          --cell-margin: 0.15rem;
          --board-padding: 0.4rem;
        }
        h1 {
          font-size: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <h1>Connect Four</h1>
    <div class="subtitle">Real-time WebSocket Edition</div>
    <div class="actions">
      <a class="action join" href="" target="_blank" rel="noopener noreferrer">Join Game</a>
      <a class="action watch" href="" target="_blank" rel="noopener noreferrer">Watch Game</a>
    </div>
    <div class="board"></div>
    <script src="main.js" type="module"></script>
  </body>
</html>
